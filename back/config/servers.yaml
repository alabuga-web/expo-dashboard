kafka:
  bootstrap_servers: kafka:9092
  topic: plc.tag.events

poll:
  interval_sec: 1.0

database:
  path: plc_data.db

servers:
  - id: simulator
    endpoint: opc.tcp://opc-simulator:4840
    nodeset: "Выставка демо.PLC_2.OPCUA.xml"
    groups: [inputs, outputs, memory]

  - id: plc_2
    endpoint: opc.tcp://192.168.0.1:4840
    nodeset: "Выставка демо.PLC_2.OPCUA.xml"
    groups: [inputs, outputs, memory]
