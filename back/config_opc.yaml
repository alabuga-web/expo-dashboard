opc:
  endpoint: "opc.tcp://192.168.0.1:4840"
  timeout_sec: 5.0
  user: ""
  password: ""
  # NodeSet экспортирован из TIA Portal (PLC_2, проект "Выставка демо")
  nodeset: "Выставка демо.PLC_2.OPCUA.xml"

database:
  enabled: true
  path: "plc_data.db"

poll:
  continuous: true
  interval_sec: 1.0

# Если nodes пустой — читаются группы из XML (см. groups)
# Если nodes задан — используются только они
groups:
  - inputs
  - outputs
  - memory

# Явный список (приоритет над groups). Эти теги покрывают один экран:
# производство по цветам, сортировка/склад и манипулятор FX5.
nodes:
  - name: plc_operating_mode
    node_id: 'ns=3;s=OperatingMode'
    group: plc
    type: SimaticOperatingState

  - name: diffuse_sensor_1
    node_id: 'ns=3;s="Diffuse Sensor 1"'
    group: inputs
    type: BOOL

  - name: diffuse_sensor_3
